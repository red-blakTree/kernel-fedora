name: Sync zen-kernel and build in Copr

on:
  schedule:
    # 每天 03:17 UTC 检查上游是否有新的 zen 正式发布
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no update'
        required: false
        type: boolean
        default: false

permissions:
  contents: write


jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.commit.outputs.commit_hash || github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync upstream version and config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_upstream.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Commit changes
        id: commit
        if: steps.diff.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync zen-kernel upstream [skip ci]"

  build:
    needs: sync
    # 有更新，或手动触发了强制构建时才提交
    if: |
      needs.sync.result == 'success' &&
      (needs.sync.outputs.changed == 'true' || github.event.inputs.force_build == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 同一仓库、同一上游版本，四个 spec 分别投给两个 Copr 工程（见 docs/build-plan.md 第 12/13 节）
        include:
          - project: binarytree/linux-zen-fedora
            subdir: linux-zen-fedora
            spec: kernel-zen.spec
          - project: binarytree/linux-zen-fedora
            subdir: linux-zen-fedora
            spec: kernel-zen-v3.spec
          - project: binarytree/linux-power
            subdir: linux-power
            spec: kernel-power.spec
          - project: binarytree/linux-power
            subdir: linux-power
            spec: kernel-power-v3.spec
          - project: binarytree/linux-power-lto
            subdir: linux-power-lto
            spec: kernel-power-lto.spec
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Submit Copr build
        id: submit
        env:
          COPR_CLI_CONFIG: ${{ secrets.COPR_CLI_CONFIG }}
          COMMIT: ${{ needs.sync.outputs.sha }}
        run: |
          if [ -z "${COPR_CLI_CONFIG}" ]; then
            echo "::error::仓库 secret COPR_CLI_CONFIG 未配置或为空（Settings → Secrets and variables → Actions），其值应为 ~/.config/copr 的全文"
            exit 1
          fi
          if ! printf '%s\n' "${COPR_CLI_CONFIG}" | grep -q '^[[:space:]]*\[copr-cli\]'; then
            echo "::error::COPR_CLI_CONFIG 缺少 [copr-cli] 段，copr-cli 无法解析"
            exit 1
          fi
          out=$(uvx copr-cli --config <(echo "${COPR_CLI_CONFIG}") buildscm --nowait \
            --clone-url "https://github.com/${{ github.repository }}" \
            --commit "${COMMIT}" \
            --subdir "${{ matrix.subdir }}" \
            --spec "${{ matrix.spec }}" \
            --type git \
            --method rpkg \
            "${{ matrix.project }}")
          printf '%s\n' "${out}"
          # copr-cli 明确说明这段输出是给用户解析的：URL 行与 Created builds 行都带 build id
          build_id=$(printf '%s\n' "${out}" \
            | sed -n -e 's#.*/build/\([0-9]\+\)/\?$#\1#p' -e 's/^Created builds: *\([0-9]\+\)$/\1/p' \
            | tail -n 1)
          if [ -z "${build_id}" ]; then
            echo "::error::未能从 copr-cli 输出解析 build id"
            exit 1
          fi
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"

      - name: Save build id
        run: echo "${{ steps.submit.outputs.build_id }}" > build-id.txt

      - name: Upload build id
        uses: actions/upload-artifact@v4
        with:
          name: copr-build-id-${{ matrix.spec }}
          path: build-id.txt

  watch:
    needs: [sync, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 必须与 build job 的 matrix 保持一致：artifact 名以 spec 为 key
        include:
          - project: binarytree/linux-zen-fedora
            subdir: linux-zen-fedora
            spec: kernel-zen.spec
          - project: binarytree/linux-zen-fedora
            subdir: linux-zen-fedora
            spec: kernel-zen-v3.spec
          - project: binarytree/linux-power
            subdir: linux-power
            spec: kernel-power.spec
          - project: binarytree/linux-power
            subdir: linux-power
            spec: kernel-power-v3.spec
          - project: binarytree/linux-power-lto
            subdir: linux-power-lto
            spec: kernel-power-lto.spec
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download build id
        uses: actions/download-artifact@v4
        with:
          name: copr-build-id-${{ matrix.spec }}

      - name: Watch Copr build
        env:
          COPR_CLI_CONFIG: ${{ secrets.COPR_CLI_CONFIG }}
        run: |
          build_id=$(cat build-id.txt)
          echo "Watching Copr build ${build_id} (${{ matrix.project }} / ${{ matrix.spec }})"
          uvx copr-cli --config <(echo "${COPR_CLI_CONFIG}") watch-build "${build_id}"
